<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人狼シナリオメーカー</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>人狼シナリオメーカー</h1>
    <div class="header-actions">
      <button id="btn-export" type="button">JSON書き出し</button>
      <label class="button">JSON読み込み<input id="input-import" type="file" accept="application/json" hidden></label>
      <button id="btn-reset" type="button" class="danger">リセット</button>
    </div>
  </header>

  <nav class="tabs">
    <button type="button" class="tab active" data-tab="setup">① 配役</button>
    <button type="button" class="tab" data-tab="scenario">② シナリオ</button>
    <button type="button" class="tab" data-tab="preview">③ 台本プレビュー</button>
  </nav>

  <main>
    <section id="tab-setup" class="tab-panel active">
      <div class="card">
        <label class="field">タイトル<input id="title" type="text" placeholder="例：第1回 人狼村"></label>
        <label class="field">メモ（コンセプト・見どころなど）<textarea id="memo" rows="3"></textarea></label>
      </div>
      <div class="card">
        <div class="card-head">
          <h2>登場人物と役職</h2>
          <div>
            <button id="btn-add-player" type="button">＋ 追加</button>
            <button id="btn-random-roles" type="button">役職をランダム配布</button>
          </div>
        </div>
        <div id="role-summary" class="role-summary"></div>
        <table class="players">
          <thead><tr><th>色</th><th>名前</th><th>役職</th><th>キャラ設定メモ</th><th></th></tr></thead>
          <tbody id="player-list"></tbody>
        </table>
      </div>
    </section>

    <section id="tab-scenario" class="tab-panel">
      <div id="day-list"></div>
      <button id="btn-add-day" type="button" class="wide">＋ 次の日を追加</button>
    </section>

    <section id="tab-preview" class="tab-panel">
      <div class="card">
        <div class="card-head">
          <h2>台本プレビュー</h2>
          <button id="btn-copy" type="button">コピー</button>
        </div>
        <pre id="preview"></pre>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
