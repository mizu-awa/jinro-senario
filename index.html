<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>人狼シナリオメーカー</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="tabs">
    <button type="button" class="tab active" data-tab="setup">配役</button>
    <button type="button" class="tab" data-tab="scenario">シナリオ</button>
    <button type="button" class="tab" data-tab="preview">台本</button>
  </nav>

  <main>
    <section id="tab-setup" class="tab-panel active">
      <div class="card">
        <input id="title" type="text" placeholder="タイトル">
      </div>
      <div class="card">
        <h2>メンバー <span id="role-summary" class="muted"></span></h2>
        <div id="player-list"></div>
        <button id="btn-add-player" type="button" class="wide">＋ メンバー追加</button>
      </div>
      <div class="card">
        <h2>プリセット</h2>
        <div class="row">
          <select id="preset-select"></select>
          <button id="btn-preset-load" type="button">読込</button>
          <button id="btn-preset-delete" type="button" class="danger">削除</button>
        </div>
        <button id="btn-preset-save" type="button" class="wide">今のメンバーをプリセット保存</button>
      </div>
      <button id="btn-reset" type="button" class="wide danger">シナリオをリセット</button>
    </section>

    <section id="tab-scenario" class="tab-panel">
      <div id="day-list"></div>
      <button id="btn-add-day" type="button" class="wide">＋ 次の日を追加</button>
    </section>

    <section id="tab-preview" class="tab-panel">
      <button id="btn-copy" type="button" class="wide">台本をコピー</button>
      <pre id="preview"></pre>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
